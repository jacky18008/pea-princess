  # ---------- Legislation ----------
  - id: legislation_renters_rights_act_2025
    name: "Renters' Rights Act 2025 (c. 26)"
    url: "https://www.legislation.gov.uk/ukpga/2025/26/contents"
    access: open
    method: GET
    used_for: [tenancy_law, section21, rent_increase]
    tested: {date: "2026-09-03", http: 200, ok: true, note: "VERIFIED EXACT TITLE: 'Renters' Rights Act 2025', UK Public General Act 2025 chapter 26 (ukpga/2025/26). 150 KB contents page."}
  - id: legislation_rra_commencement_no2
    name: "Renters' Rights Act 2025 (Commencement No. 2 and Transitional and Saving Provisions) Regulations 2026 (SI 2026/421)"
    url: "https://www.legislation.gov.uk/uksi/2026/421/regulation/2/made"
    access: open
    method: GET
    used_for: [tenancy_law, commencement_date]
    tested: {date: "2026-09-03", http: 200, ok: true, note: "COMMENCEMENT VERIFIED ON THIS URL. Regulation 2 reads: '...come into force on 1st May 2026 for the purposes of assured tenancies that are not social housing assured tenancies only - (a) Chapter 1 of Part 1 (tenancy reform: assured tenancies), except section 25(3); (b) Schedule 1 (changes to grounds for possession); (c) Schedule 2...'. So for England the new assured-tenancy regime (end of s.21 / of fixed-term ASTs) bites from 2026-05-01, i.e. it is already in force today (2026-09-03)."}
  - id: legislation_deregulation_2015_s44
    name: "Deregulation Act 2015 s.44 - short-term use of London accommodation (the 90-night rule)"
    url: "https://www.legislation.gov.uk/ukpga/2015/20/section/44"
    access: open
    method: GET
    used_for: [short_let, airbnb, lease_breach, planning]
    tested: {date: "2026-09-03", http: 200, ok: true, note: "VERIFIED CONTENT: s.44 'Short-term use of London accommodation: relaxation of restrictions' amends the Greater London Council (General Powers) Act 1973, inserting s.25A so that temporary sleeping accommodation in Greater London is not a material change of use if the statutory conditions are met - this is the source of the 90-nights-a-year limit. The '90 nights' figure itself sits in the inserted s.25A conditions, not in the s.44 heading."}

