# London flat-vetting: verified public data sources
# Every URL below was fetched exactly once on 2026-09-03 with:
#   curl -sS -L -m 12 -A "<Chrome 128 on macOS UA>" -o <tmp> -w "%{http_code} %{content_type} %{url_effective}"
# `http` is the status of that fetch; `ok` is whether the response was the real, usable page
# (a 200 that is actually a bot-interruption body is recorded as ok: false).
# `robots` records what https://<host>/robots.txt said for User-agent: * on the search path.
version: "2026-09-03"
tested_from: "London, UK network (macOS, curl 8.7.1 / LibreSSL 3.3.6)"

london_wide:

  # ---------- Planning (London-wide) ----------
  - id: gla_planning_datahub_post
    name: "GLA Planning Datahub - Elasticsearch _search (POST)"
    url: "https://planningdata.london.gov.uk/api-guest/applications/_search"
    access: open
    method: POST
    used_for: [planning, construction_risk, development_pipeline]
    tested: {date: "2026-09-03", http: 200, ok: true, note: "Body {\"size\":1,\"query\":{\"match_all\":{}}} with Content-Type: application/json returned Elasticsearch JSON; hits.total.value 10000 (relation gte); first _id 'Islington-P2025_0271_FUL'. No key, no cookie."}
  - id: gla_planning_datahub_get
    name: "GLA Planning Datahub - Elasticsearch _search (GET form)"
    url: "https://planningdata.london.gov.uk/api-guest/applications/_search?source=%7B%22size%22%3A1%2C%22query%22%3A%7B%22match_all%22%3A%7B%7D%7D%7D&source_content_type=application%2Fjson"
    access: open
    method: GET
    used_for: [planning, construction_risk, development_pipeline]
    tested: {date: "2026-09-03", http: 200, ok: true, note: "GET form works identically to POST: pass the query as ?source=<url-encoded JSON>&source_content_type=application/json. Same payload as the POST test."}
    note: "Covers all 33 London LPAs in one index - the fastest way to find applications near an address without touching 33 borough portals. Fields include decision_conditions, so plant-noise and construction conditions are searchable."

  - id: gla_rogue_landlord_checker
    name: "GLA Rogue Landlord and Agent Checker"
    url: "https://www.london.gov.uk/programmes-strategies/housing-and-land/renting-home/private-renting/check-landlord-or-agent/rogue-landlord-and-agent-checker"
    access: open
    method: GET
    used_for: [landlord_identity, agent_identity, enforcement_history]
    tested: {date: "2026-09-03", http: 200, ok: true, note: "SERVER-RENDERED. Drupal Views exposed form, method=GET, action=self, fields name= and address= (plus sort_by, sort_order). Base page carried 10 result accordion cards and 21 server-rendered facet-item links; ?name=smith returned a page 62 KB smaller with those cards gone. No ajaxViews / views_dom_id / use_ajax markers anywhere in the HTML, so results do NOT need JS."}
    note: "Filter with ?name=<landlord or agent>&address=<text>. Only records enforcement action taken by London boroughs and reported to the GLA - absence is NOT proof of a clean landlord."

