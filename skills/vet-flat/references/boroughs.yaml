boroughs:
  - name: "City of London"
    gss_code: "E09000001"
    planning_search:
      url: "https://www.planning2.cityoflondon.gov.uk/online-applications/"
      system: idox
      tested: {date: "2026-09-03", http: 200, ok: true, note: "Idox Public Access, title 'Simple Search'. Square Mile only - almost no residential stock, but the place to check what is being built next to a Barbican/Aldgate flat."}
      robots: "* Disallow: / (robots.txt 200)"
    committee:
      url: "https://democracy.cityoflondon.gov.uk/mgListCommittees.aspx?bcr=1"
      system: moderngov
      tested: {date: "2026-09-03", http: 200, ok: true, note: "Title 'Committee structure - Modern Council'."}
    licensing:
      url: "https://www.cityoflondon.gov.uk/services/licensing/other-licence-and-business-permit-types/houses-in-multiple-occupation-hmo"
      schemes_active: [mandatory]
      tested: {date: "2026-09-03", http: 200, ok: true, note: "MANDATORY ONLY: 'a house or flat shared by five or more people, consisting of two or more households... you need to apply for a mandatory HMO licence'. Corroborated on /services/environmental-health/housing-standards/private-rented-accommodation (tested 200). Neither page mentions additional or selective licensing. Page last updated 16/02/2023; the site is React-rendered but the content is present in the served HTML."}
    licensed_register:
      url: null
      tested: null
      note: "NO ONLINE REGISTER. /services/environmental-health/public-registers (tested 200) lists a 'Licensed houses in multiple occupation register' and states that registers not online are viewable BY APPOINTMENT, free of charge, at City of London Environment Department, PO Box 270, Guildhall, EC2P 2EJ, tel 020 7332 3630. Do not confuse the 'Search the public register' link on that page - it is the alcohol/entertainment register, not HMOs."
    council_tax:
      url: "https://www.cityoflondon.gov.uk/services/council-tax"
      tested: {date: "2026-09-03", http: 200, ok: true}
    notes: "Square Mile: Idox planning portal works and is the cleanest in London, but there is no online HMO register at all - a licence check is an appointment at the Guildhall. Mandatory HMO licensing only, so 'no licence' tells you nothing about a 3-4 person share here. Very little residential stock; the planning portal matters mainly for what is being built next door."

  - name: "Barking and Dagenham"
    gss_code: "E09000002"
    planning_search:
      url: "https://online-befirst.lbbd.gov.uk/planning/index.html?fa=search"
      system: northgate
      tested: {date: "2026-09-03", http: 202, ok: false, note: "NEC/Northgate 'Regulatory Services Hub'. Returned HTTP 202 with a ZERO-BYTE body to curl - the hub answers non-JS clients with an empty 202, so the search must be driven in a real browser. Planning service is delivered by Be First (the council's regeneration company), hence the online-befirst.lbbd.gov.uk host."}
      robots: "* Disallow: / (robots.txt 200)"
    committee:
      url: "https://lbbd.moderngov.co.uk/mgListCommittees.aspx?bcr=1"
      system: moderngov
      tested: {date: "2026-09-03", http: 403, ok: false, note: "Cloudflare 'Just a moment...' interstitial on the moderngov.co.uk host. The council-hosted mirror https://modgov.lbbd.gov.uk/internet/mgListCommittees.aspx?bcr=1 resolves (51.105.24.193) but the connection failed on test."}
    licensing:
      url: "https://www.lbbd.gov.uk/private-sector-housing/property-licensing"
      schemes_active: [mandatory, additional, selective]
      tested: {date: "2026-09-03", http: 403, ok: false, note: "SCHEMES NOT VERIFIED FROM THE COUNCIL PAGE. The whole www.lbbd.gov.uk host returns a plain nginx 403 Forbidden (not a JS challenge) to every automated client on every path tested, and web.archive.org playback was rate-limited from this network. Scheme facts come from indexed extracts of the council's own pages plus Propertymark coverage: a selective licensing scheme took effect 6 April 2025 across three targeted designation areas for five years; an additional licensing scheme launched 9 January 2025 for five years covering properties occupied by three or four persons in two or more households; plus statutory mandatory HMO licensing."}
