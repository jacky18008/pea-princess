  epc:
    en: "Energy certificate (EPC)"
    zh-TW: "能源效率證書（EPC）"
    zh-CN: "能源效率证书（EPC）"
    term: "Energy Performance Certificate"
    plain: "A government energy report every home must have. It also states the real indoor floor area, so it is the arbiter of size."
    plain-zh-TW: "每間住宅都必須有的政府能源報告。上面寫的室內面積是官方認定值，用來裁決坪數爭議。"
    plain-zh-CN: "每间住宅都必须有的政府能源报告。上面写的室内面积是官方认定值，用来裁决坪数争议。"
  rdsap:
    en: "Simplified survey (RdSAP)"
    zh-TW: "簡化評估（RdSAP）"
    zh-CN: "简化评估（RdSAP）"
    term: "Reduced Data Standard Assessment Procedure"
    plain: "A quick energy survey of an existing home, done by looking at it rather than at the building plans."
    plain-zh-TW: "既有住宅的快速能源評估，靠現場目視而不是建築圖。"
    plain-zh-CN: "既有住宅的快速能源评估，靠现场目视而不是建筑图。"
  sap:
    en: "Full calculation (SAP)"
    zh-TW: "完整計算（SAP）"
    zh-CN: "完整计算（SAP）"
    term: "Standard Assessment Procedure"
    plain: "The full energy calculation done for a new-build from its design data. Its presence usually means the flat is new."
    plain-zh-TW: "新成屋依設計資料做的完整能源計算。出現它通常代表這是新樓。"
    plain-zh-CN: "新成屋依设计资料做的完整能源计算。出现它通常代表这是新楼。"
  air_permeability:
    en: "Airtightness"
    zh-TW: "氣密度"
    zh-CN: "气密度"
    term: "air permeability"
    plain: "How much air leaks through the walls and windows. A very tight flat needs a fan system, because the windows alone will not clear the air."
    plain-zh-TW: "牆和窗漏多少風。很氣密的房子一定要靠機械通風，光開窗換不了氣。"
    plain-zh-CN: "墙和窗漏多少风。很气密的房子一定要靠机械通风，光开窗换不了气。"
  mvhr:
    en: "Fan ventilation with heat recovery (MVHR)"
    zh-TW: "熱回收機械通風（MVHR）"
    zh-CN: "热回收机械通风（MVHR）"
    term: "Mechanical Ventilation with Heat Recovery"
    plain: "A box that pushes fresh air in and pulls stale air out through ducts, keeping the warmth. If the ducts are shared, smells travel."
    plain-zh-TW: "用風管送新鮮空氣進來、把濁氣抽出去，同時留住熱。風管若是共用的，味道會跑。"
    plain-zh-CN: "用风管送新鲜空气进来、把浊气抽出去，同时留住热。风管若是共用的，味道会跑。"
  mev:
    en: "Extract-only fan system (MEV)"
    zh-TW: "單向排氣通風（MEV）"
    zh-CN: "单向排气通风（MEV）"
    term: "Mechanical Extract Ventilation"
    plain: "Fans that only suck air out of the kitchen and bathroom; fresh air seeps in through vents."
    plain-zh-TW: "只從廚房和浴室抽氣，新鮮空氣靠氣孔滲進來。"
    plain-zh-CN: "只从厨房和浴室抽气，新鲜空气靠气孔渗进来。"
  heat_network:
    en: "Building-wide heating (heat network)"
    zh-TW: "熱網供暖"
    zh-CN: "热网供暖"
    term: "heat network / district heating"
    plain: "One big boiler for the whole estate pipes heat to every flat. You cannot switch supplier, so the price is whatever they charge."
    plain-zh-TW: "整個社區共用一套鍋爐，熱水管進每一戶。不能換供應商，價格他們說了算。"
    plain-zh-CN: "整个社区共用一套锅炉，热水管进每一户。不能换供应商，价格他们说了算。"
  standing_charge:
    en: "Daily fixed charge"
    zh-TW: "固定日費"
    zh-CN: "固定日费"
    term: "standing charge"
    plain: "A fee charged every single day just for being connected, even if you use nothing."
    plain-zh-TW: "只要接著管線就每天照收的固定費，一度不用也要付。"
    plain-zh-CN: "只要接着管线就每天照收的固定费，一度不用也要付。"
  billing_agent:
    en: "Billing company"
    zh-TW: "計費商"
    zh-CN: "计费商"
    term: "heat billing agent"
    plain: "The company that reads your heat meter and sends the bill. It is often not the landlord and often the one people complain about."
    plain-zh-TW: "抄你熱表、寄帳單的公司。通常不是房東，也通常是被罵最多的那一家。"
    plain-zh-CN: "抄你热表、寄账单的公司。通常不是房东，也通常是被骂最多的那一家。"
  custodial_deposit:
    en: "Deposit held by a government scheme"
    zh-TW: "官方保管押金"
    zh-CN: "官方保管押金"
    term: "custodial deposit protection"
    plain: "Your deposit sits with an approved scheme, not in the landlord's account, so it cannot quietly disappear."
    plain-zh-TW: "押金放在政府核可的保管機構，不在房東帳戶裡，不會悄悄消失。"
    plain-zh-CN: "押金放在政府核可的保管机构，不在房东账户里，不会悄悄消失。"
  deposit_cap:
    en: "Deposit limit"
    zh-TW: "押金上限"
    zh-CN: "押金上限"
    term: "five weeks' rent cap"
    plain: "In England a deposit cannot legally be more than five weeks of rent. More than that is a warning sign."
    plain-zh-TW: "英格蘭的押金依法不得超過五週租金，超過就是警訊。"
    plain-zh-CN: "英格兰的押金依法不得超过五周租金，超过就是警讯。"
  holding_deposit:
    en: "Reservation fee"
    zh-TW: "保留金"
    zh-CN: "保留金"
    term: "holding deposit"
    plain: "The small payment that takes a flat off the market while paperwork runs. It cannot legally be more than one week of rent."
    plain-zh-TW: "為了把房子先押下來、跑文件期間付的小額款。依法不得超過一週租金。"
    plain-zh-CN: "为了把房子先押下来、跑文件期间付的小额款。依法不得超过一周租金。"
  client_money_protection:
    en: "Client money protection"
    zh-TW: "客戶金錢保障"
    zh-CN: "客户金钱保障"
    term: "Client Money Protection (CMP)"
    plain: "Insurance that pays you back if the letting agent takes your money and goes bust. Agents in England must have it."
    plain-zh-TW: "仲介倒閉時能把你的錢賠回來的保險。英格蘭的仲介依法必須加入。"
    plain-zh-CN: "中介倒闭时能把你的钱赔回来的保险。英格兰的中介依法必须加入。"
  redress_scheme:
    en: "Complaints scheme"
    zh-TW: "申訴機制"
    zh-CN: "申诉机制"
    term: "redress scheme"
    plain: "An official complaints service that can order an agent to pay you. Every agent must belong to one."
    plain-zh-TW: "官方的申訴管道，可以裁定仲介賠錢給你。每家仲介都必須加入其中一個。"
    plain-zh-CN: "官方的申诉管道，可以裁定中介赔钱给你。每家中介都必须加入其中一个。"
  assured_tenancy:
    en: "Standard private tenancy"
    zh-TW: "一般私租租約"
    zh-CN: "一般私租租约"
    term: "assured tenancy"
    plain: "The normal private renting contract in England, with legal protection against being thrown out at will."
    plain-zh-TW: "英格蘭一般的私人租賃契約，法律上不能說趕就趕。"
    plain-zh-CN: "英格兰一般的私人租赁契约，法律上不能说赶就赶。"
  periodic_tenancy:
    en: "Rolling tenancy"
    zh-TW: "滾動式租約"
    zh-CN: "滚动式租约"
    term: "periodic tenancy"
    plain: "A tenancy that runs month to month with no fixed end date. Since 2026 this is the only kind for new private lets in England."
    plain-zh-TW: "一個月一個月滾下去、沒有固定到期日的租約。2026 年起英格蘭新的私人出租只有這一種。"
    plain-zh-CN: "一个月一个月滚下去、没有固定到期日的租约。2026 年起英格兰新的私人出租只有这一种。"
  rent_in_advance_cap:
    en: "Rent up front limit"
    zh-TW: "預付租金上限"
    zh-CN: "预付租金上限"
    term: "one month's rent in advance"
    plain: "A landlord in England cannot ask for more than one month of rent before you move in. Being asked for six is not normal."
    plain-zh-TW: "英格蘭房東不能要求你搬進去前先付超過一個月租金。被要求六個月並不正常。"
    plain-zh-CN: "英格兰房东不能要求你搬进去前先付超过一个月租金。被要求六个月并不正常。"
  right_to_manage:
    en: "Residents' right to take over management"
    zh-TW: "住戶接管權（RTM）"
    zh-CN: "住户接管权（RTM）"
    term: "Right to Manage (RTM)"
    plain: "A legal route for flat owners to sack the managing agent and run the building themselves. Without it, bad management cannot be replaced."
    plain-zh-TW: "住戶依法把管理公司換掉、自己管樓的途徑。沒有這條路，管理再爛也換不掉。"
    plain-zh-CN: "住户依法把管理公司换掉、自己管楼的途径。没有这条路，管理再烂也换不掉。"
  rmc:
    en: "Residents' management company"
    zh-TW: "住戶管理公司（RMC）"
    zh-CN: "住户管理公司（RMC）"
    term: "Resident Management Company (RMC)"
    plain: "A company owned by the flat owners that runs the building. Its existence usually means residents have real power."
    plain-zh-TW: "由住戶持股、負責管理整棟樓的公司。有它通常代表住戶真的有話語權。"
    plain-zh-CN: "由住户持股、负责管理整栋楼的公司。有它通常代表住户真的有话语权。"
  managing_agent:
    en: "Managing agent"
    zh-TW: "物業管理公司"
    zh-CN: "物业管理公司"
    term: "managing agent"
    plain: "The firm paid to run the building day to day: cleaning, lifts, repairs, security."
    plain-zh-TW: "被付錢負責日常管樓的公司：清潔、電梯、修繕、保全。"
    plain-zh-CN: "被付钱负责日常管楼的公司：清洁、电梯、修缮、保安。"
  freeholder:
    en: "Freeholder"
    zh-TW: "永久產權人"
    zh-CN: "永久产权人"
    term: "freeholder"
    plain: "Whoever owns the land and the building outright, forever."
    plain-zh-TW: "永久擁有土地和整棟建物的人。"
    plain-zh-CN: "永久拥有土地和整栋建物的人。"
  leaseholder:
    en: "Leaseholder"
    zh-TW: "租賃產權人"
    zh-CN: "租赁产权人"
    term: "leaseholder"
    plain: "Whoever owns a flat for a long fixed number of years rather than forever. Usually your landlord."
    plain-zh-TW: "擁有某一戶一段很長的年限、但不是永久的人，通常就是你的房東。"
    plain-zh-CN: "拥有某一户一段很长的年限、但不是永久的人，通常就是你的房东。"
  service_charge:
    en: "Service charge"
    zh-TW: "管理費"
    zh-CN: "管理费"
    term: "service charge"
    plain: "The yearly bill for running the building. Usually the owner pays it, but it shapes how well the place is looked after."
    plain-zh-TW: "維持整棟樓運作的年度費用。通常由屋主付，但直接決定這棟樓被照顧得好不好。"
    plain-zh-CN: "维持整栋楼运作的年度费用。通常由屋主付，但直接决定这栋楼被照顾得好不好。"
  permitted_development:
    en: "Building without full permission"
    zh-TW: "許可開發權"
    zh-CN: "许可开发权"
    term: "permitted development"
    plain: "Some building work is allowed without asking the council, so a new block can appear with little warning."
    plain-zh-TW: "有些工程不必向地方政府申請就能做，所以新樓可能幾乎沒有預警就冒出來。"
    plain-zh-CN: "有些工程不必向地方政府申请就能做，所以新楼可能几乎没有预警就冒出来。"
  officer_report:
    en: "Council planning report"
    zh-TW: "規劃官報告"
    zh-CN: "规划官报告"
    term: "planning officer report"
    plain: "The council's own written assessment of a building proposal. It usually contains the exact distances to nearby homes."
    plain-zh-TW: "地方政府對某個建案的正式書面評估，裡面通常寫著到鄰近住宅的精確距離。"
    plain-zh-CN: "地方政府对某个建案的正式书面评估，里面通常写着到邻近住宅的精确距离。"
  pre_commencement_condition:
    en: "Condition before work can start"
    zh-TW: "動工前條件"
    zh-CN: "动工前条件"
    term: "pre-commencement condition"
    plain: "A requirement a builder must satisfy before touching the site. When these start being signed off, digging is close."
    plain-zh-TW: "建商動土前必須先滿足的條件。這些開始被核准，代表快要開挖了。"
    plain-zh-CN: "建商动土前必须先满足的条件。这些开始被核准，代表快要开挖了。"
  vsc:
    en: "Daylight at the window"
    zh-TW: "窗前日照量"
    zh-CN: "窗前日照量"
    term: "Vertical Sky Component (VSC)"
    plain: "A standard measure of how much sky a window can still see. Below about 27 percent, planners call the room poorly lit."
    plain-zh-TW: "衡量一扇窗還看得到多少天空的標準指標。低於約 27%，規劃單位就視為採光不足。"
    plain-zh-CN: "衡量一扇窗还看得到多少天空的标准指标。低于约 27%，规划单位就视为采光不足。"
  sky_openness:
    en: "How much sky you can see"
    zh-TW: "天空開闊度"
    zh-CN: "天空开阔度"
    term: "sky openness / obstruction angle"
    plain: "Stand at the window and look up: the more sky, the brighter the room stays all year."
    plain-zh-TW: "站在窗前抬頭看，天空看得越多，這個房間一整年就越亮。"
    plain-zh-CN: "站在窗前抬头看，天空看得越多，这个房间一整年就越亮。"
  all_in_cost:
    en: "All-in monthly cost"
    zh-TW: "全部月成本"
    zh-CN: "全部月成本"
    term: "all-in cost"
    plain: "Rent plus every bill plus council tax, worked out the same way for every flat."
    plain-zh-TW: "租金加上所有帳單加上市政稅，每一戶都用同一種算法。"
    plain-zh-CN: "租金加上所有账单加上市政税，每一户都用同一种算法。"
  break_even_rent:
    en: "Break-even rent"
    zh-TW: "打平租金"
    zh-CN: "打平租金"
    term: "break-even rent"
    plain: "The rent at which the flat's problems stop outweighing what you get."
    plain-zh-TW: "租金降到這個數字，缺點才不再蓋過優點。"
    plain-zh-CN: "租金降到这个数字，缺点才不再盖过优点。"
  price_per_sqft:
    en: "Rent per square foot"
    zh-TW: "每平方呎租金"
    zh-CN: "每平方呎租金"
    term: "price per square foot on certified area"
    plain: "Monthly rent divided by the certified indoor area. Always use the certificate area, never the advert's."
    plain-zh-TW: "月租除以官方證書上的室內面積。永遠用證書的數字，不要用廣告的。"
    plain-zh-CN: "月租除以官方证书上的室内面积。永远用证书的数字，不要用广告的。"
  organic_score:
    en: "Genuine review score"
    zh-TW: "有機評分"
    zh-CN: "有机评分"
    term: "organic score"
    plain: "The rating left once prompted, rewarded and same-day-burst reviews are thrown out."
    plain-zh-TW: "把被邀請的、有獎勵的、同一天灌進來的評價全部剔掉之後，剩下的分數。"
    plain-zh-CN: "把被邀请的、有奖励的、同一天灌进来的评价全部剔掉之后，剩下的分数。"
  incentivised_review:
    en: "Prompted review"
    zh-TW: "邀評"
    zh-CN: "邀评"
    term: "incentivised review"
    plain: "A review written after someone asked for it or offered something. It pushes the average up by a point or two."
    plain-zh-TW: "被請託或有好處才寫的評價，通常會把平均分推高一到兩分。"
    plain-zh-CN: "被请托或有好处才写的评价，通常会把平均分推高一到两分。"
  zero_denominator:
    en: "No reviews at all"
    zh-TW: "分母為零"
    zh-CN: "分母为零"
    term: "zero denominator"
    plain: "A building with no reviews is unknown, not clean. Small buildings often have none."
    plain-zh-TW: "一棟樓完全沒有評價，是不知道，不是乾淨。小樓常常一則都沒有。"
    plain-zh-CN: "一栋楼完全没有评价，是不知道，不是干净。小楼常常一则都没有。"
  short_let:
    en: "Short-stay letting"
    zh-TW: "短租"
    zh-CN: "短租"
    term: "short let"
    plain: "Flats rented out by the night or the week, so your neighbours change constantly."
    plain-zh-TW: "按夜或按週出租的單位，鄰居會一直換。"
    plain-zh-CN: "按夜或按周出租的单位，邻居会一直换。"
  predatory_crime:
    en: "Crime against people"
    zh-TW: "掠食型犯罪"
    zh-CN: "掠食型犯罪"
    term: "predatory subset"
    plain: "The crimes that happen to a person walking, not to a parked car: robbery, violence, pickpocketing, harassment."
    plain-zh-TW: "發生在行人身上、而不是停放車輛上的犯罪：搶劫、暴力、扒竊、騷擾。"
    plain-zh-CN: "发生在行人身上、而不是停放车辆上的犯罪：抢劫、暴力、扒窃、骚扰。"
  night_route_node:
    en: "Trouble spot on the walk home"
    zh-TW: "夜歸線節點"
    zh-CN: "夜归线节点"
    term: "night route node"
    plain: "A place where crimes cluster that sits directly on your route from the station to the door."
    plain-zh-TW: "犯罪聚集的地點，剛好就落在你從車站走回家的那條路上。"
    plain-zh-CN: "犯罪聚集的地点，刚好就落在你从车站走回家的那条路上。"
  redundancy_grade:
    en: "Backup route grade"
    zh-TW: "冗餘等級"
    zh-CN: "冗余等级"
    term: "redundancy grade A/B/C"
    plain: "A means two independent rail lines within a ten-minute walk, B means one plus a usable bus, C means one line and no plan B."
    plain-zh-TW: "A＝步行十分鐘內有兩條互相獨立的軌道線，B＝一條加上一條可用公車，C＝只有一條、沒有備案。"
    plain-zh-CN: "A＝步行十分钟内有两条互相独立的轨道线，B＝一条加上一条可用公车，C＝只有一条、没有备案。"
  trunk_road:
    en: "Main road"
    zh-TW: "幹道"
    zh-CN: "干道"
    term: "trunk road / A-road"
    plain: "A big through-road carrying traffic all night. Distance from it predicts how well you sleep."
    plain-zh-TW: "整夜都有車流的大型通過性道路。離它多遠，直接預測你睡得好不好。"
    plain-zh-CN: "整夜都有车流的大型通过性道路。离它多远，直接预测你睡得好不好。"
  guarantor:
    en: "Guarantor"
    zh-TW: "保證人"
    zh-CN: "担保人"
    term: "guarantor"
    plain: "A person who promises to pay your rent if you cannot. Landlords often want one based in the same country."
    plain-zh-TW: "承諾你付不出租金時代你付的人。房東通常要求人在同一個國家。"
    plain-zh-CN: "承诺你付不出租金时代你付的人。房东通常要求人在同一个国家。"
  rent_guarantee_insurance:
    en: "Guarantor insurance"
    zh-TW: "租金保證保險"
    zh-CN: "租金担保保险"
    term: "rent guarantee insurance"
    plain: "A paid service that acts as your guarantor when you do not have one. It costs a few weeks of rent."
    plain-zh-TW: "沒有保證人時，付費請公司當你的保證人，費用大約幾週租金。"
    plain-zh-CN: "没有担保人时，付费请公司当你的担保人，费用大约几周租金。"
  renters_rights_act:
    en: "Renters' Rights Act 2025"
    zh-TW: "2025 租客權利法"
    zh-CN: "2025 租客权利法"
    term: "Renters' Rights Act 2025 (England, in force 2026-05-01)"
    plain: "The English law that ended fixed-term private tenancies and capped rent in advance at one month and deposits at five weeks."
    plain-zh-TW: "英格蘭的法律，終結了固定期限的私人租約，並把預付租金限在一個月、押金限在五週。"
    plain-zh-CN: "英格兰的法律，终结了固定期限的私人租约，并把预付租金限在一个月、押金限在五周。"
  council_tax_band:
    en: "Council tax band"
    zh-TW: "市政稅級距"
    zh-CN: "市政税级距"
    term: "council tax band"
    plain: "A letter from A to H that sets the local tax on the home. Full-time students are usually exempt."
    plain-zh-TW: "A 到 H 的字母，決定這間房子的地方稅。全職學生通常免徵。"
    plain-zh-CN: "A 到 H 的字母，决定这间房子的地方税。全职学生通常免征。"
  companies_house:
    en: "Companies House"
    zh-TW: "英國公司登記處"
    zh-CN: "英国公司登记处"
    term: "Companies House"
    plain: "The free public register of every UK company: who owns it, how old it is, whether its accounts are late."
    plain-zh-TW: "免費公開的英國公司登記處：誰持股、成立多久、財報有沒有遲交。"
    plain-zh-CN: "免费公开的英国公司登记处：谁持股、成立多久、财报有没有迟交。"
  build_to_rent:
    en: "Purpose-built rental block"
    zh-TW: "整棟出租建案"
    zh-CN: "整栋出租建案"
    term: "build to rent (BTR)"
    plain: "A whole building owned by one company and built only to be rented. Repairs are usually faster, and the rent is usually higher."
    plain-zh-TW: "整棟由一家公司持有、專為出租而蓋的樓。修繕通常比較快，租金通常比較貴。"
    plain-zh-CN: "整栋由一家公司持有、专为出租而盖的楼。修缮通常比较快，租金通常比较贵。"
