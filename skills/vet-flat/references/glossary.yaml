# Part of Pea Princess (vet-flat) by Hsien Hao (Jacky) Chen — https://github.com/jacky18008/pea-princess — CC BY 4.0
#
# Labels and glosses for the report. scripts/render.py and viewer/viewer.html read this
# file so the SAME report JSON renders in the reader's language without the model
# translating anything. viewer/build_viewer.py inlines it into viewer.html.
#
# FORMAT (deliberately tiny, so a 60-line standard-library parser can read it):
#   * two-space indent, exactly three levels: version / terms / <id> / <field>
#   * every scalar value is a double-quoted JSON string on one line
#   * a line whose first non-space character is # is a comment
# Fields per term:
#   en, zh-TW, zh-CN   the label shown to the reader in that language (required: en)
#   plain              one sentence a twelve-year-old understands (English)
#   plain-zh-TW,
#   plain-zh-CN        the same sentence in Chinese; renderers fall back to `plain`
#   term               the original jargon, shown on hover where the label is plain
version: "1.0"
terms:

  # ---------------------------------------------------------------- sections
  section.verdict:
    en: "Verdict"
    zh-TW: "判決"
    zh-CN: "判决"
    plain: "The answer in one line: go and see it, or do not."
    plain-zh-TW: "一句話的答案：去看，還是不去。"
    plain-zh-CN: "一句话的答案：去看，还是不去。"
  section.hard_filters:
    en: "Your must-haves versus this flat"
    zh-TW: "你的硬條件 vs 這一戶"
    zh-CN: "你的硬条件 vs 这一户"
    plain: "Each thing you said you needed, and whether this flat has it."
    plain-zh-TW: "你說過非有不可的每一項，這戶有沒有。"
    plain-zh-CN: "你说过非有不可的每一项，这户有没有。"
  section.comparison:
    en: "Side by side"
    zh-TW: "並排比較"
    zh-CN: "并排比较"
    plain: "The same numbers for every flat, measured the same way."
    plain-zh-TW: "每一戶都用同一把尺量出來的同一組數字。"
    plain-zh-CN: "每一户都用同一把尺量出来的同一组数字。"
  section.worst_reviews:
    en: "Worst resident reviews"
    zh-TW: "最壞的住戶評論"
    zh-CN: "最坏的住户评论"
    plain: "The angriest things residents wrote, in their own words."
    plain-zh-TW: "住戶罵得最兇的原文，不改寫。"
    plain-zh-CN: "住户骂得最凶的原文，不改写。"
  section.landmines:
    en: "Landmines"
    zh-TW: "雷點"
    zh-CN: "雷点"
    plain: "Problems that only show up after you move in."
    plain-zh-TW: "搬進去以後才會發作的問題。"
    plain-zh-CN: "搬进去以后才会发作的问题。"
  section.axes:
    en: "The 12 checks in detail"
    zh-TW: "十二軸細節"
    zh-CN: "十二轴细节"
    plain: "The twelve things this report checks, one by one."
    plain-zh-TW: "這份報告固定查的十二件事，一件一件講。"
    plain-zh-CN: "这份报告固定查的十二件事，一件一件讲。"
  section.questions:
    en: "Questions to ask, and what to check on the day"
    zh-TW: "要問的問題與看房日檢查"
    zh-CN: "要问的问题与看房日检查"
    plain: "What to ask before you go, and what only your own eyes and nose can settle."
    plain-zh-TW: "去之前要問什麼，以及只有你的眼睛和鼻子能判定的事。"
    plain-zh-CN: "去之前要问什么，以及只有你的眼睛和鼻子能判定的事。"
  section.gaps:
    en: "What we could not find"
    zh-TW: "沒查到的東西"
    zh-CN: "没查到的东西"
    plain: "Things we looked for and did not get, with the exact words we searched."
    plain-zh-TW: "查過但沒拿到的東西，附上搜過的原字串。"
    plain-zh-CN: "查过但没拿到的东西，附上搜过的原字串。"
  section.sources:
    en: "Sources and when they were read"
    zh-TW: "資料出處與抓取時間"
    zh-CN: "资料出处与抓取时间"
    plain: "Every page this report used, and the moment it was read."
    plain-zh-TW: "這份報告用到的每一頁，以及讀取的時間。"
    plain-zh-CN: "这份报告用到的每一页，以及读取的时间。"
  section.about:
    en: "About this report"
    zh-TW: "關於這份報告"
    zh-CN: "关于这份报告"
    plain: "Who made it, with what, and under which rules."
    plain-zh-TW: "誰做的、用什麼做的、照哪一套規則做的。"
    plain-zh-CN: "谁做的、用什么做的、照哪一套规则做的。"

  # ---------------------------------------------------------------- verdicts
  verdict.PASS:
    en: "Worth viewing"
    zh-TW: "值得去看"
    zh-CN: "值得去看"
    term: "PASS"
    plain: "Nothing here stops you. Book the viewing."
    plain-zh-TW: "沒有攔路的東西，可以約看房。"
    plain-zh-CN: "没有拦路的东西，可以约看房。"
  verdict.EDGE:
    en: "Only at a lower rent"
    zh-TW: "降租才划算"
    zh-CN: "降租才划算"
    term: "EDGE"
    plain: "It works only if the rent comes down to the break-even figure shown."
    plain-zh-TW: "租金降到下面那個打平價才成立。"
    plain-zh-CN: "租金降到下面那个打平价才成立。"
  verdict.CONDITIONAL:
    en: "Only if these are agreed in writing"
    zh-TW: "有條件：要書面答應"
    zh-CN: "有条件：要书面答应"
    term: "CONDITIONAL"
    plain: "Fine, but only after the listed conditions are put in writing."
    plain-zh-TW: "可以，但下列條件要先白紙黑字答應。"
    plain-zh-CN: "可以，但下列条件要先白纸黑字答应。"
  verdict.KILL:
    en: "Do not view"
    zh-TW: "不要去看"
    zh-CN: "不要去看"
    term: "KILL"
    plain: "One thing here cannot be fixed or negotiated away. Skip it."
    plain-zh-TW: "有一件事既修不好也談不掉，跳過。"
    plain-zh-CN: "有一件事既修不好也谈不掉，跳过。"

  # --------------------------------------------------------- evidence grades
  evidence.G:
    en: "Official record"
    zh-TW: "官方登記"
    zh-CN: "官方登记"
    term: "G (government / official register)"
    plain: "It comes from a government or public register, so it is checkable by anyone."
    plain-zh-TW: "來自政府或公開登記處，任何人都能自己去核。"
    plain-zh-CN: "来自政府或公开登记处，任何人都能自己去核。"
  evidence.S:
    en: "Self-reported"
    zh-TW: "自家說法"
    zh-CN: "自家说法"
    term: "S (self-reported)"
    plain: "The landlord, agent or advert said it. Nobody has checked it."
    plain-zh-TW: "房東、仲介或廣告自己說的，沒有人核過。"
    plain-zh-CN: "房东、中介或广告自己说的，没有人核过。"
  evidence.C:
    en: "Third party"
    zh-TW: "第三方"
    zh-CN: "第三方"
    term: "C (corroborating third party)"
    plain: "Someone else with no stake said it: a resident, a reporter, a neighbour."
    plain-zh-TW: "沒有利害關係的第三方說的：住戶、記者、鄰居。"
    plain-zh-CN: "没有利害关系的第三方说的：住户、记者、邻居。"
  evidence.I:
    en: "Inferred"
    zh-TW: "推測"
    zh-CN: "推测"
    term: "I (inference)"
    plain: "Nobody said it. We worked it out from other facts, and we say which."
    plain-zh-TW: "沒有人這樣說，是從別的事實推出來的，並會註明從哪推的。"
    plain-zh-CN: "没有人这样说，是从别的事实推出来的，并会注明从哪推的。"
  evidence.U:
    en: "Unknown"
    zh-TW: "不知道"
    zh-CN: "不知道"
    term: "U (unknown)"
    plain: "We could not find out. An unknown is never treated as a pass."
    plain-zh-TW: "查不到。查不到絕不當成通過。"
    plain-zh-CN: "查不到。查不到绝不当成通过。"

  # ------------------------------------------------------------- the 12 axes
  axis.1:
    en: "Identity"
    zh-TW: "身份"
    zh-CN: "身份"
    plain: "Is this really the flat the advert says it is."
    plain-zh-TW: "這到底是不是廣告上寫的那一戶。"
    plain-zh-CN: "这到底是不是广告上写的那一户。"
  axis.2:
    en: "Floor area"
    zh-TW: "室內面積"
    zh-CN: "室内面积"
    plain: "How much indoor space you actually get, from the official certificate."
    plain-zh-TW: "照官方證書算，你實際拿到多少室內空間。"
    plain-zh-CN: "照官方证书算，你实际拿到多少室内空间。"
  axis.3:
    en: "Age and fabric"
    zh-TW: "屋齡與構造"
    zh-CN: "屋龄与构造"
    plain: "How old the building is, and how it is heated and ventilated."
    plain-zh-TW: "樓有多老，怎麼供暖、怎麼通風。"
    plain-zh-CN: "楼有多老，怎么供暖、怎么通风。"
  axis.4:
    en: "Construction nearby"
    zh-TW: "周邊工地"
    zh-CN: "周边工地"
    plain: "What is being built next door, and when the noise happens."
    plain-zh-TW: "隔壁在蓋什麼，噪音會落在哪段時間。"
    plain-zh-CN: "隔壁在盖什么，噪音会落在哪段时间。"
  axis.5:
    en: "Crime"
    zh-TW: "治安"
    zh-CN: "治安"
    plain: "What the police recorded around this address, over a fixed six months."
    plain-zh-TW: "固定六個月內，警方在這個地址周邊記錄到什麼。"
    plain-zh-CN: "固定六个月内，警方在这个地址周边记录到什么。"
  axis.6:
    en: "Management and neighbours"
    zh-TW: "管理與鄰居"
    zh-CN: "管理与邻居"
    plain: "Who runs the building, how well, and who lives next to you."
    plain-zh-TW: "誰在管這棟樓、管得好不好、隔壁住的是誰。"
    plain-zh-CN: "谁在管这栋楼、管得好不好、隔壁住的是谁。"
  axis.7:
    en: "Agent and landlord compliance"
    zh-TW: "仲介與房東合規"
    zh-CN: "中介与房东合规"
    plain: "Whether the people taking your money are registered and insured to do it."
    plain-zh-TW: "收你錢的人有沒有依法登記、有沒有保障。"
    plain-zh-CN: "收你钱的人有没有依法登记、有没有保障。"
  axis.8:
    en: "Price"
    zh-TW: "價格"
    zh-CN: "价格"
    plain: "What you pay per square foot, against what similar flats cost."
    plain-zh-TW: "你每平方呎付多少，跟附近同類比起來如何。"
    plain-zh-CN: "你每平方呎付多少，跟附近同类比起来如何。"
  axis.9:
    en: "Aspect and light"
    zh-TW: "朝向與採光"
    zh-CN: "朝向与采光"
    plain: "Which way the windows face and how much sky they can see."
    plain-zh-TW: "窗戶朝哪邊，看得到多少天空。"
    plain-zh-CN: "窗户朝哪边，看得到多少天空。"
  axis.10:
    en: "All-in cost"
    zh-TW: "全部月成本"
    zh-CN: "全部月成本"
    plain: "Everything you pay each month, not just the rent."
    plain-zh-TW: "每個月真正要付出去的全部，不只租金。"
    plain-zh-CN: "每个月真正要付出去的全部，不只租金。"
  axis.11:
    en: "Commute and redundancy"
    zh-TW: "通勤與備援"
    zh-CN: "通勤与备援"
    plain: "How long the journey takes, and what happens when one line stops."
    plain-zh-TW: "通勤要多久，以及有一條線停擺時怎麼辦。"
    plain-zh-CN: "通勤要多久，以及有一条线停摆时怎么办。"
  axis.12:
    en: "Low-maintenance living"
    zh-TW: "省事度"
    zh-CN: "省事度"
    plain: "How much daily hassle the flat removes: laundry, parcels, shops, sleep."
    plain-zh-TW: "這戶幫你省掉多少日常麻煩：洗衣、收包裹、買東西、睡覺。"
    plain-zh-CN: "这户帮你省掉多少日常麻烦：洗衣、收包裹、买东西、睡觉。"

  # --------------------------------------------------------- landmines L1-L12
  landmine.L1:
    en: "Area illusion"
    zh-TW: "面積幻覺"
    zh-CN: "面积幻觉"
    plain: "The advert makes the flat sound bigger than the official certificate says it is."
    plain-zh-TW: "廣告寫的坪數比官方證書上的大。"
    plain-zh-CN: "广告写的坪数比官方证书上的大。"
  landmine.L2:
    en: "Blocked windows, no sky"
    zh-TW: "遮擋、看不到天空"
    zh-CN: "遮挡、看不到天空"
    plain: "Another wall stands close enough to take the daylight away."
    plain-zh-TW: "旁邊有牆擋得太近，白天光被吃掉。"
    plain-zh-CN: "旁边有墙挡得太近，白天光被吃掉。"
  landmine.L3:
    en: "Crime on the walk home"
    zh-TW: "夜歸動線上的治安點"
    zh-CN: "夜归动线上的治安点"
    plain: "The trouble sits on the path between the station and your door, so you cannot avoid it."
    plain-zh-TW: "出事的點就在車站到家門的路上，繞不開。"
    plain-zh-CN: "出事的点就在车站到家门的路上，绕不开。"
  landmine.L4:
    en: "Facing a main road or railway"
    zh-TW: "面幹道或鐵路"
    zh-CN: "面干道或铁路"
    plain: "The noise comes with the address and no window can be closed hard enough."
    plain-zh-TW: "噪音跟著地址來，窗戶關再緊也沒用。"
    plain-zh-CN: "噪音跟着地址来，窗户关再紧也没用。"
  landmine.L5:
    en: "Building works during your tenancy"
    zh-TW: "租期內的工地"
    zh-CN: "租期内的工地"
    plain: "A site is running now, or a tall scheme gets decided while you live there."
    plain-zh-TW: "現在就在施工，或有高樓案會在你住的期間拍板。"
    plain-zh-CN: "现在就在施工，或有高楼案会在你住的期间拍板。"
  landmine.L6:
    en: "Heat network tariff"
    zh-TW: "熱網費率"
    zh-CN: "热网费率"
    plain: "Heat is bought from one building-wide system at a price you cannot shop around."
    plain-zh-TW: "暖氣只能跟整棟共用的系統買，價錢不能比價。"
    plain-zh-CN: "暖气只能跟整栋共用的系统买，价钱不能比价。"
  landmine.L7:
    en: "Bad management you cannot replace"
    zh-TW: "換不掉的爛管理"
    zh-CN: "换不掉的烂管理"
    plain: "The building is run badly and the residents have no legal way to sack the manager."
    plain-zh-TW: "樓管得很差，住戶又沒有合法途徑把管理公司換掉。"
    plain-zh-CN: "楼管得很差，住户又没有合法途径把管理公司换掉。"
  landmine.L8:
    en: "Reviews you cannot trust"
    zh-TW: "評價不可用"
    zh-CN: "评价不可用"
    plain: "The reviews were prompted, paid for, or too old, and no reviews at all is not the same as no problems."
    plain-zh-TW: "評價是被邀來的、被買的，或太舊；而完全沒有評價不等於沒有問題。"
    plain-zh-CN: "评价是被邀来的、被买的，或太旧；而完全没有评价不等于没有问题。"
  landmine.L9:
    en: "Short-let or churn neighbours"
    zh-TW: "短租或流動鄰居"
    zh-CN: "短租或流动邻居"
    plain: "The flats around you change people every week, so the corridor behaves like a hotel."
    plain-zh-TW: "隔壁每週換人，走廊像旅館。"
    plain-zh-CN: "隔壁每周换人，走廊像旅馆。"
  landmine.L10:
    en: "Ground or lower-ground floor, or a floor number that is not real"
    zh-TW: "地面層或半地下，或樓層編號不實"
    zh-CN: "地面层或半地下，或楼层编号不实"
    plain: "Street-level and below-street flats need extra checks for damp, mould, security and light (a caution, not a veto), and the advertised floor may not match the official record."
    plain-zh-TW: "地面層與半地下要多查潮濕、發霉、安全與採光（是提醒不是否決）；廣告寫的樓層也可能跟官方紀錄不符。"
    plain-zh-CN: "地面层与半地下要多查潮湿、发霉、安全与采光（是提醒不是否决）；广告写的楼层也可能跟官方纪录不符。"
  landmine.L11:
    en: "Too hot, or smells from shared ventilation"
    zh-TW: "無冷氣、通風串味"
    zh-CN: "无冷气、通风串味"
    plain: "It bakes in summer with no cooling, or the shared air ducts carry other people's cooking in."
    plain-zh-TW: "夏天很熱又沒冷氣，或共用風管把別人家的油煙送進來。"
    plain-zh-CN: "夏天很热又没冷气，或共用风管把别人家的油烟送进来。"
  landmine.L12:
    en: "Landlord type and money gate"
    zh-TW: "房東型態與錢閘"
    zh-CN: "房东型态与钱闸"
    plain: "Who actually owns it, and what they will demand up front before handing over keys."
    plain-zh-TW: "真正的產權人是誰，以及交鑰匙前會要求你先付什麼。"
    plain-zh-CN: "真正的产权人是谁，以及交钥匙前会要求你先付什么。"
  landmine.L13:
    en: "Licence, not a tenancy"
    zh-TW: "執照不是租約"
    zh-CN: "许可不是租约"
    plain: "A short stay sold as a 'let' but legally only permission to occupy: the deposit need not be protected and renewal is week by week at the operator's say-so."
    plain-zh-TW: "短租看起來像租約，法律上只是「允許你住」：押金不必託管，續住由業者每週決定。"
    plain-zh-CN: "短租看起来像租约，法律上只是“允许你住”：押金不必托管，续住由业者每周决定。"
  landmine.L14:
    en: "The money gate has no route for you"
    zh-TW: "錢閘沒有你走得通的路"
    zh-CN: "钱闸没有你走得通的路"
    plain: "The landlord's published rules only allow ways to pass the income check that you cannot use, such as a UK guarantor only."
    plain-zh-TW: "房東公布的收入審核規則裡，只有你走不通的路，例如只收英國保證人。"
    plain-zh-CN: "房东公布的收入审核规则里，只有你走不通的路，例如只收英国保证人。"
  landmine.L15:
    en: "Non-refundable money paid before certainty"
    zh-TW: "還沒確定就先付的不可退款項"
    zh-CN: "还没确定就先付的不可退款项"
    plain: "Fees, premiums or prepaid stays you cannot get back, paid before the dates, your eligibility or your exclusive hold on the flat are confirmed in writing."
    plain-zh-TW: "在日期、資格或房子是否確定留給你都還沒白紙黑字之前，就先付出去且拿不回來的費用。"
    plain-zh-CN: "在日期、资格或房子是否确定留给你都还没白纸黑字之前，就先付出去且拿不回来的费用。"
  landmine.L16:
    en: "Headline price is not the price"
    zh-TW: "標價不是實價"
    zh-CN: "标价不是实价"
    plain: "The advertised number leaves out the first week, part-month billing, platform or admin fees, or a discount that is on the website but not in your offer."
    plain-zh-TW: "廣告上的數字沒算進第一週、不足月的計費、平台與行政費，或是網站上有但你的合約裡沒有的折扣。"
    plain-zh-CN: "广告上的数字没算进第一周、不足月的计费、平台与行政费，或是网站上有但你的合约里没有的折扣。"

  # --------------------------------------------------------- comparison table
  ui.price_per_sqft:
    en: "Rent per square foot"
    zh-TW: "每平方呎租金"
    zh-CN: "每平方呎租金"
    plain: "Rent divided by the real indoor area, so two flats can be compared fairly."
    plain-zh-TW: "租金除以真實室內面積，兩戶才比得下去。"
    plain-zh-CN: "租金除以真实室内面积，两户才比得下去。"
  ui.crime_6mo:
    en: "Crimes recorded, 6 months"
