# Part of Pea Princess (vet-flat) by Hsien Hao (Jacky) Chen — https://github.com/jacky18008/pea-princess — CC BY 4.0
#
# Curated demand spikes for London accommodation, read by scripts/calendar.py.
# Nothing here is scraped. Venue calendars change every week and their terms
# forbid crawling, so this file names the calendar and the tool tells you to open it.
#
# The one rule this file exists to protect
#   We have never measured how much any of these moves a price. So no entry
#   claims an uplift, and the word "typical" describes a WINDOW, never a price.
#   If you ever want to write a number here, measure it first, then cite it.
#
# The distinction that matters
#   structural  university term start. Every September, without exception, and it
#               tightens long lets AND short lets at the same time. This is the real
#               cause of the September squeeze; it is not an "event".
#   citywide    a recurring occasion on the city's calendar (Carnival, the Marathon,
#               Fashion Week, New Year, Pride). Dates move year to year; the window
#               is typical, not fixed.
#   venue       a show, concert or match at one building. On the venue's own schedule,
#               not on any yearly cycle, and it pushes prices up only around that
#               venue. Never assume one is on; never assume one is not.
#
# Field guide
#   kind            structural | citywide | venue
#   window_from     typical start, as MM-DD (the window, not a claim about this year)
#   window_to       typical end, as MM-DD
#   moveable        true when the actual dates move year to year and must be checked
#   anchor          a rule that fixes the date exactly, when one exists
#                   (last_monday_august = the August bank holiday weekend)
#   affects         who feels it, in plain words
#   check           what to open to confirm this year's dates
#   district        the postcode district it sits in, for the --near filter
#   lat / lng       the venue point (postcodes.io, from the venue's own postcode)
#   radius_note     how far the price effect is thought to reach. Direction only.
#
# The areas block at the foot is a small gazetteer: district centres from
# postcodes.io outcodes, plus the rail modes that actually serve the district.
# It decides which venue calendars to open and which closure feed to read.
# It is not a location claim about anything and must never be quoted as one.

version: "2026-09-06"
checked_on: 2026-09-06
gazetteer_source: "https://api.postcodes.io/outcodes/SE8"

rules:
  no_magnitude: "Say 'known to push local prices up; magnitude not measured here'. Never a number, never a multiplier, never a range."
  structural_is_the_cause: "University term start is the structural squeeze. It hits long lets and short lets together, every September. A venue event is local and occasional. Do not describe them as the same thing."
  wimbledon_is_july: "Wimbledon is late June to mid-July and is irrelevant to a September arrival. It is in this file because SW19 residents ask."
  venues_are_not_scraped: "The tool names the calendar and the window. You open it."

price_radius_km: 2
price_radius_note: "Prices are thought to move within about 2 km of a venue. Beyond that a big night at it is usually not what moved your quote. Magnitude not measured here."
check_band_km: 8
check_band_note: "The tool tells you to open a venue's calendar when it is within about 8 km of your areas, which is wider than the price band on purpose: a bridge stay two or three stops away is still competing with the same crowd."

spikes:

  - id: term_start
    name: "University term start"
    kind: structural
    window_text: "mid-September to early October, every year"
    window_from: "09-07"
    window_to: "10-11"
    moveable: false
    anchor: null
    affects: "the whole city, long lets and short lets at the same time"
    why: "Tens of thousands of students arrive inside three weeks and need a bed in both markets at once. This is the real cause of the September squeeze; everything else that month is a local top-up."
    check: "references/term-dates.yaml, then the university's own term-dates page"
    source: "references/term-dates.yaml"
    note: "Known to tighten supply and push prices up; magnitude not measured here."

  - id: notting_hill_carnival
    name: "Notting Hill Carnival"
    kind: citywide
    window_text: "the August bank holiday weekend: the Sunday and the Monday"
    window_from: "08-23"
    window_to: "09-01"
    moveable: true
    anchor: last_monday_august
    affects: "west and central London hardest; hotel demand across the city"
    why: "One of the largest street events in Europe, on a weekend when the whole country already has a day off."
    check: "https://nhcarnival.org"
    source: "https://www.gov.uk/bank-holidays"
    note: "The date is fixed by the bank holiday, so the tool computes it. Known to push prices up; magnitude not measured here."

  - id: london_marathon
    name: "London Marathon"
    kind: citywide
    window_text: "late April, a Sunday"
    window_from: "04-19"
    window_to: "04-28"
    moveable: true
    anchor: null
    affects: "hotels along the route: Greenwich, Docklands, the City, Westminster"
    why: "Tens of thousands of runners and their families book beds near the start and the finish, months ahead."
    check: "https://www.tcslondonmarathon.com"
    source: "https://www.tcslondonmarathon.com"
    note: "Known to push prices up near the route; magnitude not measured here."

  - id: london_fashion_week
    name: "London Fashion Week"
    kind: citywide
    window_text: "mid-September, and again in February"
    window_from: "09-11"
    window_to: "09-24"
    moveable: true
    anchor: null
    affects: "central London hotels, and it lands inside the term-start window"
    why: "An international trade audience arrives in central London in the same fortnight the students do. The two stack."
    check: "https://londonfashionweek.co.uk"
    source: "https://londonfashionweek.co.uk"
    note: "Known to push central prices up; magnitude not measured here. Its real cost to you is that it sits on top of term start."

  - id: new_year
    name: "New Year in London"
    kind: citywide
    window_text: "27 December to 2 January"
    window_from: "12-27"
    window_to: "01-02"
    moveable: false
    anchor: null
    affects: "central London, and everything on the river"
    why: "A fixed international peak, and the week when agents, referencing companies and councils are shut."
    check: "https://www.london.gov.uk"
    source: "https://www.gov.uk/bank-holidays"
    note: "Also the week a signing stalls: offices are closed. Known to push prices up; magnitude not measured here."

  - id: pride_in_london
    name: "Pride in London"
    kind: citywide
    window_text: "late June or early July, a Saturday"
    window_from: "06-24"
    window_to: "07-08"
    moveable: true
    anchor: null
    affects: "central London for the weekend"
    why: "A very large one-day parade through the middle of the city."
    check: "https://prideinlondon.org"
    source: "https://prideinlondon.org"
    note: "Known to push central prices up for the weekend; magnitude not measured here."

  - id: wimbledon
    name: "The Championships, Wimbledon"
    kind: citywide
    window_text: "late June to mid-July, a fortnight"
    window_from: "06-24"
    window_to: "07-16"
    moveable: true
    anchor: null
    affects: "SW19 and nearby"
    district: SW19
    why: "A fortnight of daily crowds into one suburb, with a short-let market that reprices around it."
    check: "https://www.wimbledon.com"
    source: "https://www.wimbledon.com"
    note: "July, not September. It has nothing to do with a September arrival. Known to push SW19 prices up in its fortnight; magnitude not measured here."

