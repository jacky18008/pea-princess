    lng: -0.216402
    borough: "Hammersmith and Fulham"
    check: "the venue's own events calendar"
    calendar: "https://olympia.london/whats-on"
    radius_note: "prices move within about 2 km of the venue"
    note: "Exhibitions and consumer shows in west London. The point is the same as ExCeL: a trade audience arriving for three days."
    source: "https://olympia.london/whats-on"

  - id: emirates
    name: "Emirates Stadium"
