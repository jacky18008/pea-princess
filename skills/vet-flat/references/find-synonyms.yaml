# Part of Pea Princess (vet-flat) by Hsien Hao (Jacky) Chen — https://github.com/jacky18008/pea-princess — CC BY 4.0
#
# The bilingual synonym map scripts/find.py expands a question with, so that asking in
# English finds a Chinese page and asking in Chinese finds an English contract.
#
# HOW IT IS USED
#   The question is tokenised. A group fires when any of its terms appears in the
#   question as a run of adjacent tokens. Every term of a group that fires is then added
#   to the query at weight 0.6, while the words the user actually typed keep weight 1.0 —
#   so a synonym can add a hit but never outrank a literal match on equal evidence.
#   Groups are symmetric: any term finds every other term in the same group.
#
# FORMAT (the same tiny reader as fixed-questions.yaml: scripts/scan.py, parse_questions)
#   * two-space indent; a line whose first non-space character is # is a comment
#   * `groups:` then one bare-word group name per entry, then `- "term"` lines
#   * every term is a double-quoted string, lower case, no regexes, no inline comments
#   * a term may be several words ("holding deposit"); it fires on adjacent tokens
#
# EXTENDING IT: add a term to the group it belongs to, or add a group. Nothing else
# changes. Keep groups tight — a group that means two things drags in the wrong page.
