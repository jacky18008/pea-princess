  # ------------------------------------------------- street-level imagery ---
  - id: google_streetview_metadata
    name: "Google Street View Static API — image metadata (coverage and capture date)"
    url: "https://maps.googleapis.com/maps/api/streetview/metadata"
    official: false
    access: key_free
    method: GET
    needs_key: true
    robots_note: "n/a, API host."
    tos_note: "Free of charge and consumes no quota: 'Street View Static API metadata requests are available at no charge. No quota is consumed when you request metadata.' SKU 3168-48A9-5C8C, free monthly allowance 'Unlimited'. The key still needs a Google Cloud project with a billing account attached."
    content_assertion: '"status"'
    used_by_scripts: [streetview.py]
    used_for: [street_imagery_coverage, capture_date, pano_id, facade_check]
    last_tested: 2026-09-05
    note: "Ask this BEFORE any image request: it is free, it says whether a panorama exists (status OK / ZERO_RESULTS / NOT_FOUND / OVER_QUERY_LIMIT / REQUEST_DENIED / INVALID_REQUEST / UNKNOWN_ERROR), and it returns the capture `date` and the `pano_id`. The pano_id is the only Google Maps Content the terms let you store indefinitely; pin every image request to it so all four views come from one standing position. Evidence class C — a third party's photograph of one street on one day, often years old."

  - id: google_streetview_static_image
    name: "Google Street View Static API — image"
    url: "https://maps.googleapis.com/maps/api/streetview"
    official: false
    access: paid
    method: GET
    needs_key: true
    robots_note: "n/a, API host."
    tos_note: "Maps Platform ToS 3.2.3(a) No Scraping (bulk downloading Street View images is named as prohibited) and 3.2.3(b) No Caching, with one exception: the panorama ID may be stored indefinitely. Images must not be kept and must not be taken off the maps.google.com website instead of the API. Attribution required when an image is shown: https://developers.google.com/maps/documentation/streetview/policies"
    content_assertion: "content-type starts with image/"
    used_by_scripts: [streetview.py]
    used_for: [facade_identification, ground_floor_exposure, construction_hoarding, obstruction_storeys, vacant_units, management_signals]
    last_tested: 2026-09-05
    note: "SKU 9BD0-A2EE-44C3 'Static Street View': 10,000 free calls a month, then $7.00 / 1,000 (0-100k), $5.60 / 1,000 (100k-500k), $4.20 / 1,000 (500k+), per https://developers.google.com/maps/billing-and-pricing/pricing checked 2026-09-05. Four views per flat is 4 calls. Parameters: size (max 640x640), location or pano, heading 0-360, fov default 90 max 120, pitch -90..90, radius default 50 m. Marked `paid` because it needs a billing account even inside the free allowance. Use the USER's key, never a shared one, and restrict it to this API."

  - id: mapillary_images
    name: "Mapillary Graph API v4 — street-level images"
    url: "https://graph.mapillary.com/images"
    official: false
    access: key_free
    method: GET
    needs_key: true
    robots_note: "n/a, API host."
    tos_note: "Free client token from https://www.mapillary.com/dashboard/developers. Imagery is CC BY-SA 4.0: credit the contributor, show the Mapillary logo and link back to the image page when an image is displayed. https://www.mapillary.com/terms"
    content_assertion: '"data"'
    used_by_scripts: [streetview.py]
    used_for: [street_imagery_fallback, capture_date, second_date_on_the_same_street]
    last_tested: 2026-09-05
    note: "Free alternative where there is no Google key, and a cheap second date on the same street. Coverage in London is patchy and skewed to main roads. Documented limits: bbox must be smaller than 0.01 degrees square, limit max 2000, and the separate radius search caps at 50 m — which is why the script builds a bbox and caps the radius at 300 m. Token goes in an `Authorization: OAuth <token>` header so it never enters a URL. Thumbnail URLs are signed and expire. Evidence class C."

