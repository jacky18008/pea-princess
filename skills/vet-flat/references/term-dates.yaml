    estimated: true
    estimate_note: "Term dates were read on Birkbeck's own page and are firm. There is no welcome week: Birkbeck runs orientation as a rolling series with no published block, so the welcome dates are left empty. Coarse estimate: orientation clusters in late September and the first days of October 2026."
    source: "https://www.bbk.ac.uk/about-us/term-dates"
    checked_on: 2026-09-06
    note: "The latest start in this file, and evening teaching, so a Birkbeck arrival has an extra fortnight of search that the others do not. Beware pages describing a 23 September to 13 October welcome: that is the 2024 calendar and it is still circulating."
