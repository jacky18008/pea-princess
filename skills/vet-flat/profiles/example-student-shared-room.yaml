#
# EXAMPLE PROFILE — "the student sharing a room, zone 2–3, first UK tenancy"
# Numbers from docs/london-rent-levels-2026.md: a room in a shared flat in London averages about £915 a month
# bills-included (inner £979, outer £794; SpareRoom Q2 2026); all-student households pay no council tax.
# Compare halls and student blocks on the same all-in basis: see references/student-housing.md.

flat_type: room_in_shared_flat
separate_bedroom_required: true      # your own room with a door and a window
occupants: 1                         # you; flatmates are checked, not counted here
experience: none
budget_mode: standard

min_room_area_m2: 11                 # a bed, a desk and a wardrobe fit at 11–12 m²
max_building_age_years:              # no limit; shared houses are often older — the damp check matters more

budget:
  rent_pcm_target: 900               # bills-included room in zone 2–3
  all_in_pcm_ceiling: 1100
  stretch_ceiling_and_conditions: "Up to 100 more for an ensuite or a building with proper management."

bridging:
  first_weeks: hotel_or_operator     # or a university hall's short-stay option, if one exists

move_in_window:
  earliest:
  latest:
  tolerance_days: 10

commute:
  destination: "Whitechapel Station"   # stand-in for a campus; replace with yours
  arrive_by: "09:00"
  max_door_to_door_min: 35
  redundancy_min_grade: "B"

floors:
  reject_ground_floor: false
  prefer_floor_band:

light:
  reject_no_sky: true
  aspect_scores: {N: 2, NE: 3, E: 4, SE: 4, S: 4, SW: 3, W: 3, NW: 2}

quiet_over_light: true

my_questions:
  - text: "Is everyone in this household a full-time student, and is the tenancy joint or individual?"
    when: filter
    kind: ask
    trigger: "always"
  - text: "Are bills really included, and is there a cap after which I pay?"
    when: vet
    kind: ask
    trigger: "always"
  - text: "If this room is cheaper than the others on the street, why?"
    when: compare
    kind: answer
    trigger: "price below the local band by 10% or more"

avoid:
  - a joint tenancy with strangers where one person's unpaid rent becomes mine (L14 money gate)
  - bills included with a hidden cap or a fair-use clause nobody can explain (L16)
  - a house that needs an HMO licence and does not have one (L7)
  - damp or mould on a ground or lower-ground room (L10 damp check)
  - windows onto a main road (L4)
  - short-let or hotel-style neighbours (L9)
  - paying a holding fee before seeing the room or the contract (L15)

priorities:
  - price
  - commute
  - quiet
  - flatmates

must_haves:
  - lockable_bedroom_door
  - window_in_bedroom
  - washing_machine_in_flat

nice_to_haves:
  - ensuite
  - desk_space
  - supermarket_within_3_min_walk

guarantor_route: "rent guarantee insurance"   # or a UK guarantor if you have one

tenancy:
  max_months_upfront: 1
  max_deposit_weeks: 5
  require_deposit_protection: true

self_intro_template: >-
  I am a full-time student looking for a room in a shared flat, non-smoking, no pets, able to
  provide proof of funds, with a rent guarantee product for the income check.

story_summary: >-
  First time renting abroad, on a student budget, and would rather share a well-run flat near the
  campus than live alone far out. Has heard enough about deposits vanishing and bills surprises to
  insist on a protected deposit and a written answer on what "bills included" means.
story_taken_on: "2026-09-05"

language: "en"
