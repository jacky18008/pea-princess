# A/B harness config. The `pipeline:` block is read by bench/pipeline.py; everything
# above it is the same schema bench/run.py reads.

name: P1-claude
agent: claude
phase: pipeline
factor: "role pipeline: planner and executors, no verifier"
description: |
  The first half of the pipeline. A cheap planner decides what to fetch, three cheap
  executors fetch it in parallel and write evidence items only, and the default (strong)
  model integrates. Nothing checks the evidence, so this arm isolates what the SPLIT buys
  before the verifier is added. Compare with P0 (B-lean, the single agent) and P2.
main_model: null
worker_model: sonnet
budget_mode: standard
allowed_tools:
  - "Bash(python3:*)"
  - Read
  - Write
append_system_prompt: |
  Use the scripts in scripts/ for every fetchable fact and read only their JSON. Never read a
  file larger than 40 KB in full; use ranges. Do your own role and nothing else: the roles are
  described in references/pipeline.md, and the tool list you were given is the whole of what
  this role may do.
  This is an unattended benchmark run: there is no user to answer questions, so never stop to ask; when an input is unavailable mark that axis unknown (U) and still write report.json.
notes: |
  P0 for this family is the existing B-lean arm: one agent, same cases, same grader. The
  -lite and -deep variants come from bench/pipeline.py --budget-mode, not from more files.
pipeline:
  planner:
    agent: claude
    model: sonnet
  executors:
    agent: claude
    model: sonnet
    parallel: 3
  integrator:
    agent: claude
  replan_rounds: 0
