# A/B harness config. The `pipeline:` block is read by bench/pipeline.py; everything
# above it is the same schema bench/run.py reads.

name: P3-claude
agent: claude
phase: pipeline
factor: "verifier only: the single-agent baseline, then a verify pass"
description: |
  The cheap half of the idea. The single agent runs exactly as in B-lean and writes its
  report; scripts/verify.py then derives evidence items from that report and checks them,
  a strong verifier reads the flagged ones, and the integrator rewrites anything that is
  not verified as unknown. No planner, no executors. If P3 gets most of P2's gain, the
  split is not what is doing the work - the checking is.
main_model: null
worker_model: sonnet
budget_mode: standard
allowed_tools:
  - "Bash(python3:*)"
  - Read
  - Write
  - Agent
append_system_prompt: |
  Use the scripts in scripts/ for every fetchable fact and read only their JSON. Never read a
  file larger than 40 KB in full; use ranges. Do your own role and nothing else: the roles are
  described in references/pipeline.md, and the tool list you were given is the whole of what
  this role may do.
  This is an unattended benchmark run: there is no user to answer questions, so never stop to ask; when an input is unavailable mark that axis unknown (U) and still write report.json.
notes: |
  Most numbers in a finished report carry no quote, so most items come back unknown rather
  than verified. That is the point of the arm and not a defect: an unverified number is not
  a verified one.
pipeline:
  verifier:
    agent: claude
    model: opus
  integrator:
    agent: claude
  replan_rounds: 0
