# A/B harness config. Read by bench/run.py --config and bench/ab/run_ab.py.

name: codex-C-terra-lite
agent: codex
phase: core
factor: "cheapest realistic setup on the OpenAI side"
description: |
  The twenty-pound arm on Terra with the lite appendix. Basic-functions check only; it does
  not vote on adoption.
main_model: gpt-5.6-terra
worker_model: null
budget_mode: lite
allowed_tools: null
append_system_prompt: |
  You are running on a limited plan. Follow .agents/skills/vet-flat/references/budget-modes.md
  `lite` exactly: at most 8 tool calls, run scripts only (`epc.py cert`, `crime.py box
  --months 3 --no-sensitivity`, `commute.py journey`, `company.py profile` when an entity is
  named), never read a file over 40 KB, ask the user once for anything else, and still deliver
  the verdict card, the hard-filter table and two killer questions from
  references/questions.md.
notes: |
  Codex takes no --allowedTools flag, so allowed_tools is null and the sandbox does the
  scoping: -s workspace-write with sandbox_workspace_write.network_access=true. The appendix
  is delivered as AGENTS.md in the working directory, which Codex reads on start. Model ids
  verified against the installed CLI (codex 0.151): gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna.
