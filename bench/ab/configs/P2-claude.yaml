# A/B harness config. The `pipeline:` block is read by bench/pipeline.py; everything
# above it is the same schema bench/run.py reads.

name: P2-claude
agent: claude
phase: pipeline
factor: "role pipeline: P1 plus a strong verifier and one replan round"
description: |
  The whole pipeline. Same planner and executors as P1; then scripts/verify.py runs every
  check that has one answer, a strong verifier reads only the flagged items, and one round
  of executor work goes back for what the verifier asked for. The integrator writes from
  verified items only. P2 minus P1 is what the VERIFIER buys; P1 minus P0 is what the split
  buys.
main_model: null
worker_model: sonnet
budget_mode: standard
allowed_tools:
  - "Bash(python3:*)"
  - Read
  - Write
append_system_prompt: |
  Use the scripts in scripts/ for every fetchable fact and read only their JSON. Never read a
  file larger than 40 KB in full; use ranges. Do your own role and nothing else: the roles are
  described in references/pipeline.md, and the tool list you were given is the whole of what
  this role may do.
  This is an unattended benchmark run: there is no user to answer questions, so never stop to ask; when an input is unavailable mark that axis unknown (U) and still write report.json.
notes: |
  The verifier is the one role on the strong model, which is the repository's standing rule:
  cheap workers, strong judgment.
pipeline:
  planner:
    agent: claude
    model: sonnet
  executors:
    agent: claude
    model: sonnet
    parallel: 3
  verifier:
    agent: claude
    model: opus
  integrator:
    agent: claude
  replan_rounds: 1
