<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" class="vf-chart" role="img" aria-labelledby="vfTitle vfDesc">
<title id="vfTitle">Landmine recall against cost per run</title>
<desc id="vfDesc">Two scatter panels sharing a landmine-recall y axis from 0 to 1. Left panel: nine Claude Code configurations against cost per run in US dollars on a log x axis. A-legacy, which reads raw web pages with one reader per axis, is highest and most expensive at 0.87 recall and $31.40. The B family sits between 0.38 and 0.71 recall for $1.40 to $11.70, and C-twenty is lowest and cheapest at 0.15 recall and $0.67. A shaded band from 0.40 to 0.74 marks run-to-run noise around the default configuration B-lean. Right panel: six Codex GPT-5.6 configurations as hollow markers against input tokens per run on a log x axis, from 0.13 recall at 0.36 million tokens to 0.52 recall at 12.2 million tokens. Colour marks the data path and budget mode: raw web pages, scripts in standard mode, or lite budget mode.</desc>
<style>
.vf-chart{
  --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --band:#898781; --band-op:0.10;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme:dark){
  .vf-chart{
    --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --band:#c3c2b7; --band-op:0.09;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  }
}
:root[data-theme="dark"] .vf-chart{
  --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --band:#c3c2b7; --band-op:0.09;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
}
:root[data-theme="light"] .vf-chart{
  --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --band:#898781; --band-op:0.10;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
}
.vf-chart text{fill:var(--ink2);}
.t-title{font-size:16px;font-weight:600;fill:var(--ink);}
.t-sub{font-size:11px;fill:var(--ink2);}
.t-panel{font-size:11px;font-weight:600;fill:var(--ink);}
.t-panel2{font-size:10px;fill:var(--muted);}
.t-axis{font-size:10px;fill:var(--muted);font-variant-numeric:tabular-nums;}
.t-axtitle{font-size:10px;fill:var(--ink2);}
.t-lab{font-size:11px;fill:var(--ink2);}
.t-lab-b{font-size:11px;font-weight:600;fill:var(--ink);}
.t-labk{font-size:10px;fill:var(--ink2);}
.t-note{font-size:9px;fill:var(--muted);}
.grid{stroke:var(--grid);stroke-width:1;}
.axis{stroke:var(--axis);stroke-width:1;}
.leader{stroke:var(--muted);stroke-width:1;}
.dot{stroke:var(--surface);stroke-width:2;}
.ring{fill:var(--surface);stroke-width:2;}
</style>
<rect x="0" y="0" width="960" height="530" fill="var(--surface)"/>
<text class="t-title" x="78" y="32">Landmine recall against cost per run</text>
<text class="t-sub" x="78" y="52">Eleven-axis due diligence on five real London flats, 5&#8211;10 runs per configuration, 2026-09-03/04. Higher and further left is better.</text>
<circle class="dot" cx="78.0" cy="70.5" r="5" fill="var(--s1)"/>
