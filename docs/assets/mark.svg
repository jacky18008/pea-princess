  <rect x="112" y="176" width="300" height="34" rx="15" fill="#F7E9EE" stroke="#8A2846" stroke-width="4"/>
  <rect x="100" y="138" width="300" height="34" rx="15" fill="#F0D3DC" stroke="#8A2846" stroke-width="4"/>
  <rect x="112" y="100" width="300" height="34" rx="15" fill="#F7E9EE" stroke="#8A2846" stroke-width="4"/>
